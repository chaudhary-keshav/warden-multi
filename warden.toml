version = 1

[defaults]
# Fail check on high+ severity findings (critical, high)
failOn = "high"
# Show annotations for medium+ severity findings
reportOn = "medium"
# Exclude build output from all skills
ignorePaths = ["dist/**", "evals/**"]

# MCP server configurations
[mcp.codetrellis]
command = "codetrellis"
args = ["mcp"]

[pipeline]
mode = "sequential"
skillOrder = [
  "find-warden-bugs",
  "architecture-review",
  "testing-guidelines",
  "code-simplifier",
  "codetrellis-aware-review",
]

[pipeline.compaction]
enabled = true
maxTokens = 500
includeFindings = true

[[skills]]
name = "find-warden-bugs"
paths = ["src/**/*.ts"]
ignorePaths = ["src/**/*.test.ts"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened"]

[[skills]]
name = "architecture-review"
paths = ["src/**/*.ts"]
ignorePaths = ["src/**/*.test.ts"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened"]

[[skills]]
name = "testing-guidelines"
paths = ["src/**/*.test.ts"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened"]

[[skills]]
name = "code-simplifier"
remote = "getsentry/sentry-skills"

[[skills.triggers]]
type = "pull_request"
actions = ["opened"]

[[skills]]
name = "codetrellis-aware-review"
paths = ["src/**/*.ts"]
ignorePaths = ["src/**/*.test.ts"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened"]
